[package]
name = "impact-cli"
description = "impact — tell you what you're about to break, before you break it. CLI + MCP server for deterministic code-change blast-radius analysis."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords = ["static-analysis", "mcp", "cli", "refactoring"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "impact"
path = "src/main.rs"

[dependencies]
impact-core = { path = "../impact-core" }
impact-lang-rust = { path = "../impact-lang-rust" }
impact-lang-ts = { path = "../impact-lang-ts" }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
