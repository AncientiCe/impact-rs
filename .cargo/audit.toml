[advisories]
# rustls 0.23.45 advisories published 2026-10-14, fixed in >=0.23.46, which is not yet on
# crates.io. Accepted until it is: bump rustls and delete these entries then.
#
# rustls reaches impact only through ureq, for the once-a-day release check
# (`update::fetch_latest`): one GET to GitHub's latest-release endpoint, nothing sent but
# a User-Agent, and its failure is silently ignored.
ignore = [
    # medium: `Debug` of client session values exposes TLS secrets. impact never
    # formats a ureq/rustls session with `Debug`.
    "RUSTSEC-2026-0346",
    # low: buffered data sent to the outer server after ECH rejection. ECH is not
    # configured.
    "RUSTSEC-2026-0347",
    # low: brotli certificate decompression can allocate up to 1 GiB. No brotli
    # decompressor is in the dependency tree.
    "RUSTSEC-2026-0348",
    # low: unauthenticated ServerHello can downgrade later connections to classical key
    # exchange. Only affects the release check's single connection.
    "RUSTSEC-2026-0349",
]
